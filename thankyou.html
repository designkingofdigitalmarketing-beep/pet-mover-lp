<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pet Movers - Thank You</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #ffffff;
    font-family: "Inter", sans-serif;
    color: #192b3d;

    overflow: hidden;
}


/* =========================================
   MAIN WRAPPER
========================================= */

.thank-you-wrapper {
    width: 100%;
    height: 100dvh;

    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}


/* =========================================
   CARD
========================================= */

.thank-you-card {
    position: relative;

    width: min(1120px, 100%);
    height: min(720px, calc(100dvh - 40px));

    overflow: hidden;

    border: 2px solid #f6dcd5;
    border-radius: 24px;

    background:
        radial-gradient(
            circle at 85% 15%,
            rgba(216, 239, 250, 0.9),
            transparent 30%
        ),
        radial-gradient(
            circle at 5% 25%,
            rgba(255, 224, 217, 0.65),
            transparent 14%
        ),
        #ffffff;

    padding: 32px 55px;

    display: flex;
    flex-direction: column;

    justify-content: center;
}


/* =========================================
   BACKGROUND CIRCLES
========================================= */

.bg-circle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
}

.bg-circle.one {
    width: 180px;
    height: 180px;

    left: -100px;
    top: 100px;

    background: rgba(255, 232, 226, 0.65);
}

.bg-circle.two {
    width: 280px;
    height: 280px;

    right: -130px;
    bottom: -130px;

    background: rgba(255, 230, 224, 0.55);
}


/* =========================================
   PAW DECORATIONS
========================================= */

.decor-paw {
    position: absolute;

    font-size: 42px;

    color: #ef202b;

    opacity: 0.13;

    pointer-events: none;
}

.decor-paw.top-left {
    left: 25px;
    top: 25px;
}

.decor-paw.bottom-right {
    right: 20px;
    bottom: 15px;
}


/* =========================================
   HEADER
========================================= */

.top-header {
    position: relative;
    z-index: 3;

    width: 100%;

    display: flex;

    align-items: flex-start;

    justify-content: space-between;

    margin-bottom: 5px;
}


/* =========================================
   BRAND
========================================= */

.brand {
    display: flex;

    align-items: center;

    gap: 10px;
}

.brand-heart {
    position: absolute;

    width: 45px;
    height: 45px;

    left: 5px;
    top: 5px;

    border: 3px solid #172b3e;

    border-radius: 50%;

    transform: rotate(-20deg);
}

.brand-heart::before {
    content: "";

    position: absolute;

    width: 14px;
    height: 14px;

    border: 2px solid #ed202b;

    border-radius: 50%;

    left: 12px;
    top: 12px;
}

.brand-heart::after {
    content: "•";

    position: absolute;

    color: #ed202b;

    font-size: 18px;

    left: 18px;
    top: 5px;
}

.brand-plane {
    position: absolute;

    right: -3px;
    top: -3px;

    font-size: 22px;

    transform: rotate(-15deg);
}

.brand-text {
    line-height: .85;

    font-weight: 800;

    letter-spacing: -1.5px;
}

.brand-text .pet {
    color: #ef1f2b;

    font-size: 38px;
}

.brand-text .movers {
    color: #172b3e;

    font-size: 36px;
}


/* =========================================
   HAPPY TAILS
========================================= */

.happy-tails {
    text-align: center;

    margin-right: 25px;

    transform: rotate(-5deg);
}

.happy-tails .script {
    font-family: "Caveat", cursive;

    font-size: 30px;

    line-height: .78;

    font-weight: 600;

    color: #152a3d;
}

.happy-tails .paw {
    font-size: 20px;

    display: inline-block;

    transform: rotate(15deg);

    margin-left: 3px;
}

.happy-line {
    width: 115px;
    height: 2px;

    background: #ef202b;

    border-radius: 50%;

    margin: 10px auto 0;
}


/* =========================================
   MAIN CONTENT
========================================= */

.main-content {
    position: relative;

    z-index: 2;

    width: 100%;

    flex: 1;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;
}


/* =========================================
   LEFT CONTENT
========================================= */

.left-content {
    position: relative;

    width: 100%;

    max-width: 850px;

    z-index: 5;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


/* =========================================
   TITLE
========================================= */

.thank-title {
    font-family: "Caveat", cursive;

    font-size: clamp(85px, 9vw, 125px);

    line-height: .78;

    font-weight: 600;

    color: #182b3d;

    letter-spacing: -4px;

    white-space: nowrap;
}

.thank-title .red {
    color: #ef202b;
}


/* =========================================
   HEART DIVIDER
========================================= */

.heart-divider {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    margin: 15px 0 18px;
}

.heart-divider::before,
.heart-divider::after {
    content: "";

    width: 60px;
    height: 2px;

    background: #ef202b;

    border-radius: 50%;
}

/* =========================================
   DESCRIPTION
========================================= */

.description {
    width: 100%;
    max-width: 620px;

    font-size: 19px;

    line-height: 1.5;

    color: #1a2d40;

    margin-bottom: 18px;
}


/* =========================================
   PRIORITY
========================================= */

.priority {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;

    margin: 5px 0 25px;
}


/* =========================================
   PAW ICON
========================================= */

.paw-icon {
    position: relative;

    width: 52px;
    height: 52px;

    flex-shrink: 0;
}

.paw-icon .pad {
    position: absolute;

    width: 31px;
    height: 27px;

    background: #ef202b;

    border-radius: 50% 50% 45% 45%;

    bottom: 3px;
    left: 11px;
}

.paw-icon .toe {
    position: absolute;

    width: 12px;
    height: 15px;

    background: #ef202b;

    border-radius: 50%;
}

.paw-icon .toe:nth-child(2) {
    left: 2px;
    top: 19px;

    transform: rotate(-35deg);
}

.paw-icon .toe:nth-child(3) {
    left: 13px;
    top: 3px;
}

.paw-icon .toe:nth-child(4) {
    left: 27px;
    top: 2px;

    transform: rotate(15deg);
}

.paw-icon .toe:nth-child(5) {
    left: 39px;
    top: 16px;

    transform: rotate(35deg);
}


/* =========================================
   PRIORITY TEXT
========================================= */

.priority-text {
    font-family: "Caveat", cursive;

    font-size: 31px;

    line-height: .9;

    color: #ef202b;

    font-weight: 600;

    text-align: left;
}


/* =========================================
   FEATURES
========================================= */

.features {
    display: grid;

    grid-template-columns: repeat(4, 1fr);

    width: 100%;
    max-width: 650px;
}


.feature {
    text-align: center;

    min-height: 72px;

    padding: 0 15px;

    border-right: 1px solid #e9cfc8;
}

.feature:last-child {
    border-right: none;
}


.feature-icon {
    font-size: 29px;

    color: #ef202b;

    line-height: 1;

    margin-bottom: 7px;
}


.feature-text {
    font-size: 14px;

    line-height: 1.3;

    color: #172b3e;

    font-weight: 500;
}


/* =========================================
   SUBTLE AIRPLANE
========================================= */

.main-content::after {
    content: "✈";

    position: absolute;

    right: 9%;
    top: 40%;

    font-size: 75px;

    color: rgba(239, 32, 43, .055);

    transform: rotate(-15deg);

    pointer-events: none;
}


.main-content::before {
    content: "";

    position: absolute;

    width: 220px;
    height: 100px;

    right: 7%;
    top: 32%;

    border-top: 2px dashed rgba(239, 32, 43, .10);

    border-radius: 50%;

    transform: rotate(-15deg);

    pointer-events: none;
}


/* =========================================
   TABLET
========================================= */

@media (max-width: 900px) {

    .thank-you-wrapper {
        padding: 12px;
    }

    .thank-you-card {
        height: calc(100dvh - 24px);

        padding: 25px 30px;
    }

    .thank-title {
        font-size: 95px;
    }

    .description {
        font-size: 18px;
    }

    .main-content::after,
    .main-content::before {
        display: none;
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .thank-you-wrapper {
        padding: 8px;
    }

    .thank-you-card {
        height: calc(100dvh - 16px);

        padding: 20px 16px;

        border-radius: 18px;
    }


    /* Header */

    .top-header {
        align-items: center;

        margin-bottom: 0;
    }


    .brand-text .pet {
        font-size: 28px;
    }

    .brand-text .movers {
        font-size: 27px;
    }

    .happy-tails {
        margin-right: 5px;
    }

    .happy-tails .script {
        font-size: 23px;
    }

    .happy-line {
        width: 90px;
    }


    /* Main */

    .main-content {
        align-items: center;
    }

    .thank-title {
        font-size: clamp(65px, 18vw, 85px);

        letter-spacing: -2px;
    }

    .heart-divider {
        margin: 12px 0 15px;
    }
    .description {
        max-width: 440px;

        font-size: 15px;

        line-height: 1.45;

        margin-bottom: 15px;
    }


    /* Priority */

    .priority {
        gap: 10px;

        margin: 4px 0 18px;
    }

    .paw-icon {
        transform: scale(.72);
    }

    .priority-text {
        font-size: 25px;
    }


    /* Features */

    .features {
        max-width: 420px;

        grid-template-columns: repeat(4, 1fr);
    }

    .feature {
        padding: 0 5px;

        min-height: 60px;
    }

    .feature-icon {
        font-size: 24px;

        margin-bottom: 5px;
    }

    .feature-text {
        font-size: 11px;
    }


    .decor-paw {
        font-size: 30px;
    }

}


/* =========================================
   VERY SMALL MOBILE
========================================= */

@media (max-width: 400px) {

    .thank-you-card {
        padding: 17px 12px;
    }

    .brand-text .pet {
        font-size: 25px;
    }

    .brand-text .movers {
        font-size: 24px;
    }

    .happy-tails .script {
        font-size: 21px;
    }

    .thank-title {
        font-size: 62px;
    }

    .description {
        font-size: 14px;

        max-width: 320px;
    }

    .priority-text {
        font-size: 22px;
    }

    .features {
        max-width: 340px;
    }

    .feature-icon {
        font-size: 21px;
    }

    .feature-text {
        font-size: 10px;
    }

}


/* =========================================
   SHORT DESKTOP SCREENS
========================================= */

@media (min-width: 901px) and (max-height: 750px) {

    .thank-you-card {
        height: calc(100dvh - 30px);

        padding-top: 20px;
        padding-bottom: 20px;
    }

    .thank-title {
        font-size: 90px;
    }

    .description {
        font-size: 17px;

        margin-bottom: 12px;
    }

    .priority {
        margin-bottom: 18px;
    }

    .priority-text {
        font-size: 27px;
    }

    .feature {
        min-height: 60px;
    }

    .feature-icon {
        font-size: 25px;

        margin-bottom: 5px;
    }

    .feature-text {
        font-size: 12px;
    }
}

</style>
</head>


<body>

<div class="thank-you-wrapper">

    <section class="thank-you-card">

        <!-- Background -->
        <div class="bg-circle one"></div>
        <div class="bg-circle two"></div>

        <!-- Decorative paws -->
        <div class="decor-paw top-left">🐾</div>
        <div class="decor-paw bottom-right">🐾</div>


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="top-header">

            <div class="brand">



                <div class="brand-text">

                    <div class="pet">
                        Pet
                    </div>

                    <div class="movers">
                        Movers
                    </div>

                </div>

            </div>


            <div class="happy-tails">

                <div class="script">

                    Happy Tails<br>

                    Ahead
                    <span class="paw">🐾</span>

                </div>

                <div class="happy-line"></div>

            </div>

        </header>



        <!-- =====================================
             MAIN CONTENT
        ====================================== -->

        <div class="main-content">

            <div class="left-content">


                <!-- Title -->

                <h1 class="thank-title">

                    Thank

                    <span class="red">
                        You!
                    </span>

                </h1>


                <!-- Heart -->

                <div class="heart-divider">
                </div>


                <!-- Message -->

                <p class="description">

                    Your request has been submitted successfully.
                    Our team will get in touch with you shortly
                    with all the details and next steps.

                </p>


                <!-- Priority -->

                <div class="priority">

                    <div class="paw-icon">

                        <div class="pad"></div>

                        <div class="toe"></div>

                        <div class="toe"></div>

                        <div class="toe"></div>

                        <div class="toe"></div>

                    </div>


                    <div class="priority-text">

                        Your pet's journey,<br>
                        our priority!

                    </div>

                </div>


                <!-- Features -->

                <div class="features">


                    <div class="feature">

                        <div class="feature-icon">
                            ♡
                        </div>

                        <div class="feature-text">
                            Safe<br>
                            Travel
                        </div>

                    </div>


                    <div class="feature">

                        <div class="feature-icon">
                            ♡
                        </div>

                        <div class="feature-text">
                            Caring<br>
                            Support
                        </div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">
                            ◎
                        </div>
                        <div class="feature-text">
                            Global<br>
                            Reach
                        </div>
                    </div>
                    <div class="feature">
                        <div class="feature-icon">
                            ✈
                        </div>
                        <div class="feature-text">
                            Happy<br>
                            Pets
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
